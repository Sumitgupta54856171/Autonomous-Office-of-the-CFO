version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: autocfo-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autocfo
    ports:
      - "5432:5432"
    volumes:
      - autocfo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autocfo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocfo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/autocfo
      - SQL_ECHO=false
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
    depends_on:
      db:
        condition: service_healthy

volumes:
  autocfo_pgdata:
